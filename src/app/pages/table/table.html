<h2>Ramschema - Webbutveckling</h2>
<input type="text" placeholder="Sök efter kurs...">
<table>
    <thead>
        <tr>
            <th>Kurskod</th>
            <th>Kursnamn</th>
            <th>Progression</th>
            <th>Kursplan</th>
        </tr>
    </thead>
    <tbody>
        @for (course of courses(); track course.code) {
            <tr>
                <td>{{ course.code }}</td>
                <td>{{ course.coursename }}</td>
                <td>{{ course.progression }}</td>
                <td><a href='{{ course.syllabus }}' target="_blank">Kursplan</a></td>
            </tr>
        }
    </tbody>
</table>
